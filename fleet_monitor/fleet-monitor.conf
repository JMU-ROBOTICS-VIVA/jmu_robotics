\
# JMU TurtleBot 4 fleet monitor configuration.
# Installed as /etc/jmu_tb4/fleet-monitor.conf and preserved on reinstall.

ROBOTS=(1 2 3 4 5 6 7)

STATUS_FILE="/var/lib/rosrpt/status.json"

WEB_ROOT="/var/www/html/turtlebot"
WEB_STATUS_FILE="$WEB_ROOT/status.json"

# Write/publish one dashboard snapshot per minute.
WRITE_INTERVAL=60

# Battery/dock stay subscribed continuously, so robot liveness can remain short.
STALE_SECONDS=15

# Subscribe to LiDAR/RGB/depth only for this many seconds before each snapshot.
SAMPLE_WINDOW=5

# Effective OAK-D parameters only need to be reread once per snapshot interval.
PARAMETER_INTERVAL=60

# Publication is path-triggered and should occur immediately after a new snapshot.
MAX_PUBLISH_AGE_SECONDS=30
