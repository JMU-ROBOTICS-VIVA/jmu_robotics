# JMU CS354 TurtleBot site configuration
#
# This file is installed as /opt/jmu/cs354/tb4_setup.conf.
# It is root-owned on lab machines so students can select only robots
# that are intentionally made available here.

# Physical TurtleBots that may be selected with tb4-select.
PHYSICAL_ROBOTS=(1 2 3 4 5 6 7)

# Namespace used by the first simulated TurtleBot.
SIM_NAMESPACE="/robotsim1"

# ROS domain used by the physical TurtleBot fleet.
PHYSICAL_ROS_DOMAIN_ID=42

# Separate ROS domain used by the simulator.
# This is defense-in-depth in addition to localhost-only DDS discovery.
SIM_ROS_DOMAIN_ID=43
